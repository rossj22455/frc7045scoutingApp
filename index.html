<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FRC Strategy">
<title>FRC Strategy</title>
<style>
:root {
  --bg:#0a0e1a;--bg2:#111827;--bg3:#1a2235;--card:#1e2a3d;--card2:#243047;
  --accent:#3b82f6;--accent2:#60a5fa;--accent3:#93c5fd;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}

/* NAV */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:9px;font-weight:500;letter-spacing:0.3px;transition:color 0.2s;}
.nav-btn.active{color:var(--accent2);}
.nav-btn svg{width:22px;height:22px;}

/* PAGES */
.page{display:none;min-height:100vh;padding-bottom:80px;}
.page.active{display:block;}

/* FILM PAGE HEADER — fixed height, no wrapping */
.film-header{background:var(--bg2);padding:52px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.film-header h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:2px;}
.event-bar{display:flex;gap:8px;align-items:center;margin-top:8px;}
.event-bar input{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:14px;outline:none;}
.event-bar input:focus{border-color:var(--accent);}
.event-bar button{flex-shrink:0;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:9px 16px;color:white;font-size:14px;font-weight:600;cursor:pointer;}
.event-badge{display:flex;align-items:center;gap:6px;margin-top:8px;overflow:hidden;}
.event-badge-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.event-badge-text{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* GENERIC PAGE HEADER */
.page-header{background:var(--bg2);padding:52px 16px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.page-header h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.page-header p{font-size:13px;color:var(--text2);margin-top:2px;}

/* TEAM GRID */
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:border-color 0.2s,background 0.2s;display:flex;flex-direction:column;gap:8px;}
.team-card:active{background:var(--card2);border-color:var(--accent);}
.team-logo-box{width:48px;height:48px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.team-logo-box img{width:48px;height:48px;object-fit:contain;}
.team-logo-fallback{font-weight:700;font-size:12px;color:var(--accent2);text-align:center;padding:2px;}
.team-num{font-size:18px;font-weight:700;color:var(--accent2);}
.team-name{font-size:11px;color:var(--text2);line-height:1.3;}
.team-record{font-size:12px;color:var(--text2);}
.record-w{color:var(--green);font-weight:600;}
.record-l{color:var(--red);font-weight:600;}

/* TEAM DETAIL — TRUE FULL SCREEN OVERLAY */
#teamDetail{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  z-index:200;
  background:var(--bg);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.detail-header{background:var(--bg2);padding:52px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
.back-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:7px 12px;color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.detail-header-info{min-width:0;}
.detail-header-info h2{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-header-info p{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-body{padding:14px;padding-bottom:30px;}

.video-container{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;aspect-ratio:16/9;position:relative;}
.video-container iframe{width:100%;height:100%;border:none;}
.video-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3);font-size:13px;}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
.stat-value{font-size:20px;font-weight:700;color:var(--text);}
.stat-value.good{color:var(--green);}

.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;margin-top:14px;}
.match-list{display:flex;flex-direction:column;gap:6px;}
.match-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color 0.2s;}
.match-row.active{border-color:var(--accent);}
.match-row:active{background:var(--card2);}
.match-key{font-size:12px;font-weight:600;color:var(--accent2);min-width:60px;}
.match-score{font-size:12px;color:var(--text2);flex:1;}
.match-result{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
.match-result.win{background:rgba(16,185,129,0.15);color:var(--green);}
.match-result.loss{background:rgba(239,68,68,0.15);color:var(--red);}
.match-result.tie{background:rgba(245,158,11,0.15);color:var(--amber);}
.play-icon{color:var(--accent);font-size:14px;}

.team-hero{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:14px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);}
.hero-logo-box{width:60px;height:60px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.hero-logo-box img{width:60px;height:60px;object-fit:contain;}
.hero-num{font-size:26px;font-weight:800;color:var(--accent2);}
.hero-name{font-size:14px;color:var(--text);}
.hero-loc{font-size:12px;color:var(--text2);}

.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.info-row .lbl{font-size:13px;color:var(--text2);}
.info-row .val{font-size:13px;font-weight:600;}

/* CHECKLIST */
.checklist-section{margin:14px;background:var(--card);border-radius:var(--radius);overflow:hidden;}
.checklist-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.checklist-header h3{font-size:15px;font-weight:600;}
.progress-badge{font-size:12px;background:var(--bg3);padding:4px 10px;border-radius:20px;color:var(--text2);}
.check-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:background 0.15s;border-bottom:1px solid var(--border);}
.check-item:last-of-type{border-bottom:none;}
.check-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.check-item label{font-size:14px;flex:1;cursor:pointer;line-height:1.4;}
.check-item.checked label{text-decoration:line-through;color:var(--text3);}
.check-item .del-btn{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0 4px;}
.add-item-row{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);}
.add-item-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;}
.add-item-row button{background:var(--accent);border:none;border-radius:6px;padding:8px 14px;color:white;font-size:13px;cursor:pointer;font-weight:600;}
.reset-btn{margin:0 14px 14px;background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px;color:var(--text2);font-size:13px;cursor:pointer;width:calc(100% - 28px);}
.sub-tabs{display:flex;gap:6px;padding:14px 14px 0;}
.sub-tab{flex:1;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:12px;font-weight:600;text-align:center;cursor:pointer;transition:all 0.2s;}
.sub-tab.active{background:var(--accent);border-color:var(--accent);color:white;}

/* ALLIANCE */
.alliance-container{padding:14px;}
.alliance-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.alliance-col{background:var(--card);border-radius:var(--radius);overflow:hidden;}
.alliance-col-header{padding:12px 14px;border-bottom:1px solid var(--border);}
.alliance-col-header h3{font-size:14px;font-weight:600;}
.alliance-col-header.pick h3{color:var(--green);}
.alliance-col-header.avoid h3{color:var(--red);}
.alliance-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
.alliance-item:last-child{border-bottom:none;}
.alliance-item:active{background:var(--card2);}
.alliance-num{font-size:13px;font-weight:700;color:var(--accent2);min-width:38px;}
.alliance-name{font-size:11px;color:var(--text2);flex:1;line-height:1.3;}
.alliance-remove{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 2px;}
.rank-badge{font-size:10px;font-weight:700;color:var(--text3);min-width:16px;}
.alliance-all-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;}
.all-team-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.all-team-row .ath-num{font-size:14px;font-weight:700;color:var(--accent2);min-width:50px;}
.all-team-row .ath-name{font-size:13px;color:var(--text2);flex:1;}
.all-team-actions{display:flex;gap:6px;}
.add-pick{background:rgba(16,185,129,0.15);border:none;border-radius:6px;padding:6px 10px;color:var(--green);font-size:11px;font-weight:600;cursor:pointer;}
.add-avoid{background:rgba(239,68,68,0.15);border:none;border-radius:6px;padding:6px 10px;color:var(--red);font-size:11px;font-weight:600;cursor:pointer;}

.loading{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
.spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:13px;}
.error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-sm);padding:12px;margin:14px;font-size:13px;color:#fca5a5;}
</style>
</head>
<body>

<div id="page-film" class="page active">
  <div class="film-header">
    <h1>Film Review</h1>
    <div class="event-bar">
      <input id="eventCodeInput" type="text" placeholder="Event code (e.g. 2025njfla)" autocapitalize="none" autocorrect="off" spellcheck="false"/>
      <button onclick="loadEvent()">Load</button>
    </div>
    <div id="eventBadge" style="display:none" class="event-badge">
      <div class="event-badge-dot"></div>
      <div class="event-badge-text" id="eventBadgeText"></div>
    </div>
  </div>
  <div id="filmContent"><div class="empty" style="padding-top:40px">Enter an event code above to load teams.</div></div>
</div>

<div id="page-checklist" class="page">
  <div class="page-header"><h1>Checklists</h1><p>Pre-event &amp; pre-match prep</p></div>
  <div class="sub-tabs">
    <div class="sub-tab active" id="tab-event" onclick="showChecklist('event',this)">Pre-Event</div>
    <div class="sub-tab" id="tab-match" onclick="showChecklist('match',this)">Pre-Match</div>
  </div>
  <div id="checklist-event"></div>
  <div id="checklist-match" style="display:none"></div>
</div>

<div id="page-alliance" class="page">
  <div class="page-header"><h1>Alliance Selection</h1><p id="allianceEventLabel">Load an event in Film Review first</p></div>
  <div id="allianceContent"><div class="empty" style="padding-top:30px">No event loaded.</div></div>
</div>

<!-- TEAM DETAIL FULL SCREEN OVERLAY -->
<div id="teamDetail">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">&#8592; Back</button>
    <div class="detail-header-info">
      <h2 id="detailTitle">Team</h2>
      <p id="detailSubtitle"></p>
    </div>
  </div>
  <div class="detail-body" id="detailBody">
    <div class="loading"><div class="spinner"></div>Loading...</div>
  </div>
</div>

<nav>
  <button class="nav-btn active" onclick="showPage('film',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3l-4 4-4-4"/><path d="M8 11h8M8 15h5"/></svg>
    Film
  </button>
  <button class="nav-btn" onclick="showPage('checklist',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Checklist
  </button>
  <button class="nav-btn" onclick="showPage('alliance',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg>
    Alliance
  </button>
</nav>

<script>
const TBA_KEY='sBdj6c4Yga6cd3nQTNKa6siKfkVedQKgizLVflrPSFEqmxUgyFe9jto4jjyo2cz8';
const TBA='https://www.thebluealliance.com/api/v3';
let currentEvent=localStorage.getItem('frc_event')||'';
let eventTeams=JSON.parse(localStorage.getItem('frc_teams')||'[]');
let eventStatuses=JSON.parse(localStorage.getItem('frc_statuses')||'{}');
let picklist=JSON.parse(localStorage.getItem('frc_picklist')||'[]');
let avoidlist=JSON.parse(localStorage.getItem('frc_avoidlist')||'[]');

const DEFAULT_EVENT=[
  'Bumpers (both sets)','Battery x3 minimum','Battery charger',
  'Tool bag (allen keys, screwdrivers, pliers)','Laptop + charger',
  'Driver station cable','Spare motors (Falcon, NEO)','Gearbox spare parts',
  'Zip ties + velcro','Electrical spare (breakers, wire)','Pit banner + table cloth',
  'Team shirts / buttons','Safety glasses x5','Radio + OM5P',
  'Pneumatics kit (if applicable)','3D printer filament spares',
  'Competition manual printout','Team registration docs'
];
const DEFAULT_MATCH=[
  'Robot powered on','Battery fully charged + secured','Bumpers on and tight',
  'All mechanisms move freely','Radio light solid green','Driver station connected',
  'Autonomous selected','Alliance partners confirmed','Tablet / scouting ready',
  'Strategy review done'
];

function tbaFetch(path){
  return fetch(TBA+path,{headers:{'X-TBA-Auth-Key':TBA_KEY}}).then(r=>r.json());
}

function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  closeDetail();
  if(btn)btn.classList.add('active');
  if(name==='alliance')renderAlliance();
}

// Team logo with multiple fallbacks
function teamLogoHTML(teamKey, teamNum, size=48) {
  const id='logo_'+teamKey.replace(/[^a-z0-9]/g,'_')+'_'+size;
  const year=new Date().getFullYear();
  // Try current year avatar, then previous, then frcavatars.com, then fallback to number
  return `<div class="team-logo-box" style="width:${size}px;height:${size}px;border-radius:${size>50?'10px':'8px'}">
    <img id="${id}" src="https://www.thebluealliance.com/avatar/${year}/${teamKey}.png"
      onerror="tryNextLogo(this,'${teamKey}',${teamNum},${size},1)"
      style="width:${size}px;height:${size}px;object-fit:contain;display:block"/>
  </div>`;
}
function tryNextLogo(img, teamKey, teamNum, size, step) {
  const year=new Date().getFullYear();
  const fallbacks=[
    `https://www.thebluealliance.com/avatar/${year-1}/${teamKey}.png`,
    `https://frcavatars.com/avatar/${teamKey}`,
    null
  ];
  if(step < fallbacks.length && fallbacks[step-1]!==null){
    img.onerror=()=>tryNextLogo(img,teamKey,teamNum,size,step+1);
    img.src=fallbacks[step-1];
  } else {
    // All failed — replace with number badge
    img.parentNode.innerHTML=`<div class="team-logo-fallback" style="font-size:${size>50?14:11}px;color:var(--accent2);font-weight:700;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px">${teamNum}</div>`;
  }
}

async function loadEvent(){
  const code=document.getElementById('eventCodeInput').value.trim().toLowerCase();
  if(!code)return;
  document.getElementById('filmContent').innerHTML='<div class="loading"><div class="spinner"></div>Loading event...</div>';
  document.getElementById('eventBadge').style.display='none';
  try{
    const [teams,statuses,eventInfo]=await Promise.all([
      tbaFetch('/event/'+code+'/teams'),
      tbaFetch('/event/'+code+'/teams/statuses'),
      tbaFetch('/event/'+code)
    ]);
    if(!Array.isArray(teams)||teams.length===0){
      document.getElementById('filmContent').innerHTML='<div class="error-msg">No teams found for "'+code+'". Check the code and try again.</div>';
      return;
    }
    currentEvent=code;
    eventTeams=teams.sort((a,b)=>a.team_number-b.team_number);
    eventStatuses=statuses||{};
    localStorage.setItem('frc_event',currentEvent);
    localStorage.setItem('frc_teams',JSON.stringify(eventTeams));
    localStorage.setItem('frc_statuses',JSON.stringify(eventStatuses));
    const eName=eventInfo.name||code;
    document.getElementById('eventBadgeText').textContent=eName;
    document.getElementById('eventBadge').style.display='flex';
    document.getElementById('allianceEventLabel').textContent=eName;
    renderTeamGrid();
  }catch(e){
    document.getElementById('filmContent').innerHTML='<div class="error-msg">Failed to load event. Check connection or event code.</div>';
  }
}

function renderTeamGrid(){
  if(!eventTeams.length)return;
  let html='<div class="team-grid">';
  for(const t of eventTeams){
    const s=eventStatuses[t.key];
    let rec='—';
    if(s&&s.qual&&s.qual.ranking){
      const r=s.qual.ranking;
      rec=`<span class="record-w">${r.record?.wins??0}W</span> <span class="record-l">${r.record?.losses??0}L</span> ${r.record?.ties??0}T`;
    }
    html+=`<div class="team-card" onclick="openTeam('${t.key}','${t.team_number}','${esc(t.nickname)}')">
      ${teamLogoHTML(t.key,t.team_number,48)}
      <div class="team-num">${t.team_number}</div>
      <div class="team-name">${esc(t.nickname)}</div>
      <div class="team-record">${rec}</div>
    </div>`;
  }
  html+='</div>';
  document.getElementById('filmContent').innerHTML=html;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/'/g,"&#39;").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function openTeam(teamKey,num,name){
  const el=document.getElementById('teamDetail');
  el.style.display='block';
  el.scrollTop=0;
  document.getElementById('detailTitle').textContent='Team '+num;
  document.getElementById('detailSubtitle').textContent=name;
  document.getElementById('detailBody').innerHTML='<div class="loading"><div class="spinner"></div>Loading team data...</div>';

  try{
    const reqs=[
      tbaFetch('/team/'+teamKey),
      tbaFetch('/team/'+teamKey+'/awards/2025')
    ];
    if(currentEvent){
      reqs.push(tbaFetch('/team/'+teamKey+'/event/'+currentEvent+'/matches'));
      reqs.push(tbaFetch('/event/'+currentEvent+'/rankings'));
      reqs.push(tbaFetch('/event/'+currentEvent+'/oprs'));
    }
    const results=await Promise.all(reqs);
    const info=results[0];
    const awards=results[1];
    const matches=currentEvent?(results[2]||[]):[];
    const rankings=currentEvent?results[3]:null;
    const oprs=currentEvent?results[4]:null;

    let rank=null,record=null;
    if(rankings&&rankings.rankings){
      const r=rankings.rankings.find(x=>x.team_key===teamKey);
      if(r){rank=r.rank;record=r.record;}
    }
    let oprVal=null,dprVal=null,ccwmVal=null;
    if(oprs&&oprs.oprs){oprVal=oprs.oprs[teamKey];dprVal=oprs.dprs?.[teamKey];ccwmVal=oprs.ccwms?.[teamKey];}

    const levelOrder={qm:0,ef:1,qf:2,sf:3,f:4};
    const sorted=(Array.isArray(matches)?matches:[]).sort((a,b)=>{
      const lo=(levelOrder[a.comp_level]??0)-(levelOrder[b.comp_level]??0);
      if(lo!==0)return lo;
      const so=(a.set_number||0)-(b.set_number||0);
      if(so!==0)return so;
      return(a.match_number||0)-(b.match_number||0);
    });
    let latestVideoKey=null,latestVideoMatch=null;
    for(let i=sorted.length-1;i>=0;i--){
      const m=sorted[i];
      if(m.videos){const yt=m.videos.find(v=>v.type==='youtube');if(yt){latestVideoKey=yt.key;latestVideoMatch=m;break;}}
    }
    renderTeamDetail(info,sorted,teamKey,rank,record,oprVal,dprVal,ccwmVal,latestVideoKey,latestVideoMatch,awards);
  }catch(e){
    document.getElementById('detailBody').innerHTML='<div class="error-msg">Failed to load team data.</div>';
  }
}

function renderTeamDetail(info,matches,teamKey,rank,record,opr,dpr,ccwm,videoKey,videoMatch,awards){
  const wins=record?.wins??'—',losses=record?.losses??'—',ties=record?.ties??'—';
  const winRate=(record&&(record.wins+record.losses+record.ties)>0)
    ?((record.wins/(record.wins+record.losses+record.ties))*100).toFixed(1)+'%':'—';

  const videoHTML=videoKey&&videoMatch
    ?buildVideoThumb(videoKey,videoMatch.key)
    :`<div class="video-container"><div class="video-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>No match video yet</div></div>`;

  let matchRows='';
  for(const m of matches){
    const isRed=m.alliances?.red?.team_keys?.includes(teamKey);
    const my=isRed?m.alliances?.red?.score:m.alliances?.blue?.score;
    const op=isRed?m.alliances?.blue?.score:m.alliances?.red?.score;
    let result='—',rc='';
    if(my>=0&&op>=0){if(my>op){result='W';rc='win';}else if(my<op){result='L';rc='loss';}else{result='T';rc='tie';}}
    const lbl=m.comp_level==='qm'?'Q'+m.match_number:m.comp_level.toUpperCase()+m.set_number+'M'+m.match_number;
    const sc=(my>=0&&op>=0)?`${my} - ${op}`:'TBD';
    const yt=m.videos&&m.videos.find(v=>v.type==='youtube');
    matchRows+=`<div class="match-row" onclick="${yt?`playVideo('${yt.key}',this)`:''}" style="${!yt?'opacity:0.6;cursor:default':''}">
      <span class="match-key">${lbl}</span>
      <span class="match-score">${sc}</span>
      <span class="match-result ${rc}">${result}</span>
      ${yt?'<span class="play-icon">&#9654;</span>':'<span style="font-size:10px;color:var(--text3)">no vid</span>'}
    </div>`;
    if(yt) matchRows=matchRows.replace(`playVideo('${yt.key}',this)`,`playVideo('${yt.key}','${m.key}',this)`);
  }

  document.getElementById('detailBody').innerHTML=`
    <div class="team-hero">
      ${teamLogoHTML(teamKey,info.team_number,60)}
      <div>
        <div class="hero-num">${info.team_number}</div>
        <div class="hero-name">${esc(info.nickname)}</div>
        <div class="hero-loc">${[info.city,info.state_prov,info.country].filter(Boolean).join(', ')}</div>
      </div>
    </div>
    ${videoHTML}
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Rank</div><div class="stat-value">${rank?'#'+rank:'—'}</div></div>
      <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value ${wins>losses?'good':''}">${winRate}</div></div>
      <div class="stat-card"><div class="stat-label">Record</div><div class="stat-value">${wins}-${losses}-${ties}</div></div>
      <div class="stat-card"><div class="stat-label">OPR</div><div class="stat-value">${opr!=null?opr.toFixed(1):'—'}</div></div>
      <div class="stat-card"><div class="stat-label">DPR</div><div class="stat-value">${dpr!=null?dpr.toFixed(1):'—'}</div></div>
      <div class="stat-card"><div class="stat-label">CCWM</div><div class="stat-value ${ccwm>0?'good':''}">${ccwm!=null?ccwm.toFixed(1):'—'}</div></div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:4px 14px;margin-bottom:14px">
      <div class="info-row"><span class="lbl">Rookie Year</span><span class="val">${info.rookie_year||'—'}</span></div>
      <div class="info-row"><span class="lbl">2025 Awards</span><span class="val">${awards?awards.length:0}</span></div>
      <div class="info-row"><span class="lbl">Website</span><span class="val">${info.website?`<a href="${info.website}" style="color:var(--accent2)">${info.website.replace(/https?:\/\//,'').slice(0,28)}</a>`:'—'}</span></div>
    </div>
    <div class="section-title">Match History</div>
    <div class="match-list">${matchRows||'<div class="empty">No matches played yet.</div>'}</div>`;
}

function buildVideoThumb(ytKey,matchKey){
  const thumb=`https://img.youtube.com/vi/${ytKey}/hqdefault.jpg`;
  const ytUrl=`https://www.youtube.com/watch?v=${ytKey}&autoplay=1`;
  return `<div class="video-container" id="videoBox" style="cursor:pointer;position:relative;" onclick="window.open('${ytUrl}','_blank')">
    <img src="${thumb}" style="width:100%;height:100%;object-fit:cover;display:block;"/>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><polygon points="9,7 19,12 9,17"/></svg>
      </div>
    </div>
    <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);padding:7px 12px;font-size:12px;color:white;">Tap to open in YouTube</div>
  </div>`;
}
function showVideoFallback(ytKey){}
function playVideo(ytKey,matchKey,row){
  document.querySelectorAll('.match-row').forEach(r=>r.classList.remove('active'));
  row.classList.add('active');
  const box=document.getElementById('videoBox');
  if(box){
    const ytUrl=`https://www.youtube.com/watch?v=${ytKey}&autoplay=1`;
    box.onclick=()=>window.open(ytUrl,'_blank');
    box.querySelector('img').src=thumb;
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function closeDetail(){
  document.getElementById('teamDetail').style.display='none';
}

// CHECKLISTS
function getChecklist(type){
  const key='frc_checklist_'+type;
  const stored=localStorage.getItem(key);
  if(stored)return JSON.parse(stored);
  const defs=type==='event'?DEFAULT_EVENT:DEFAULT_MATCH;
  const items=defs.map((t,i)=>({id:i,text:t,checked:false}));
  localStorage.setItem(key,JSON.stringify(items));
  return items;
}
function saveChecklist(type,items){localStorage.setItem('frc_checklist_'+type,JSON.stringify(items));}

function renderChecklist(type){
  const items=getChecklist(type);
  const done=items.filter(x=>x.checked).length;
  let rows=items.map(item=>`
    <div class="check-item ${item.checked?'checked':''}" id="ci-${type}-${item.id}">
      <input type="checkbox" id="cb-${type}-${item.id}" ${item.checked?'checked':''} onchange="toggleCheck('${type}',${item.id})"/>
      <label for="cb-${type}-${item.id}">${esc(item.text)}</label>
      <button class="del-btn" onclick="deleteCheck('${type}',${item.id})">&#10005;</button>
    </div>`).join('');
  document.getElementById('checklist-'+type).innerHTML=`
    <div class="checklist-section">
      <div class="checklist-header">
        <h3>${type==='event'?'Pre-Event':'Pre-Match'} Checklist</h3>
        <span class="progress-badge" id="prog-${type}">${done}/${items.length}</span>
      </div>
      <div class="checklist-items">${rows}</div>
      <div class="add-item-row">
        <input type="text" id="newitem-${type}" placeholder="Add item..." onkeydown="if(event.key==='Enter')addCheck('${type}')"/>
        <button onclick="addCheck('${type}')">Add</button>
      </div>
    </div>
    <button class="reset-btn" onclick="resetChecklist('${type}')">Reset All Checkboxes</button>`;
}

function toggleCheck(type,id){
  const items=getChecklist(type);
  const item=items.find(x=>x.id===id);
  if(item){item.checked=!item.checked;saveChecklist(type,items);}
  const row=document.getElementById('ci-'+type+'-'+id);
  if(row)row.classList.toggle('checked',item.checked);
  const prog=document.getElementById('prog-'+type);
  if(prog){const done=items.filter(x=>x.checked).length;prog.textContent=done+'/'+items.length;}
}
function addCheck(type){
  const inp=document.getElementById('newitem-'+type);
  const text=inp.value.trim();if(!text)return;
  const items=getChecklist(type);
  items.push({id:Date.now(),text,checked:false});
  saveChecklist(type,items);inp.value='';renderChecklist(type);
}
function deleteCheck(type,id){
  saveChecklist(type,getChecklist(type).filter(x=>x.id!==id));
  renderChecklist(type);
}
function resetChecklist(type){
  saveChecklist(type,getChecklist(type).map(x=>({...x,checked:false})));
  renderChecklist(type);
}
function showChecklist(type,tab){
  document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('checklist-event').style.display=type==='event'?'block':'none';
  document.getElementById('checklist-match').style.display=type==='match'?'block':'none';
}

// ALLIANCE
function renderAlliance(){
  if(!eventTeams.length){
    document.getElementById('allianceContent').innerHTML='<div class="empty">No event loaded. Go to Film Review and load an event first.</div>';
    return;
  }
  const pickHTML=picklist.map((tk,i)=>{
    const t=eventTeams.find(x=>x.key===tk)||{key:tk,team_number:tk,nickname:''};
    return `<div class="alliance-item" onclick="openTeam('${t.key}','${t.team_number}','${esc(t.nickname||'')}')">
      <span class="rank-badge">${i+1}</span>
      <span class="alliance-num">${t.team_number}</span>
      <span class="alliance-name">${esc(t.nickname||'')}</span>
      <button class="alliance-remove" onclick="event.stopPropagation();removeFromList('pick','${tk}')">&#10005;</button>
    </div>`;
  }).join('')||'<div style="padding:12px;font-size:12px;color:var(--text3)">None added</div>';

  const avoidHTML=avoidlist.map((tk,i)=>{
    const t=eventTeams.find(x=>x.key===tk)||{key:tk,team_number:tk,nickname:''};
    return `<div class="alliance-item" onclick="openTeam('${t.key}','${t.team_number}','${esc(t.nickname||'')}')">
      <span class="rank-badge">${i+1}</span>
      <span class="alliance-num">${t.team_number}</span>
      <span class="alliance-name">${esc(t.nickname||'')}</span>
      <button class="alliance-remove" onclick="event.stopPropagation();removeFromList('avoid','${tk}')">&#10005;</button>
    </div>`;
  }).join('')||'<div style="padding:12px;font-size:12px;color:var(--text3)">None added</div>';

  const allTeams=eventTeams.map(t=>{
    const inP=picklist.includes(t.key),inA=avoidlist.includes(t.key);
    return `<div class="all-team-row">
      <span class="ath-num">${t.team_number}</span>
      <span class="ath-name">${esc(t.nickname)}</span>
      <div class="all-team-actions">
        <button class="add-pick" onclick="addToList('pick','${t.key}')" ${inP?'disabled style="opacity:0.4"':''}>+ Pick</button>
        <button class="add-avoid" onclick="addToList('avoid','${t.key}')" ${inA?'disabled style="opacity:0.4"':''}>Avoid</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('allianceContent').innerHTML=`
    <div class="alliance-container">
      <div class="alliance-cols">
        <div class="alliance-col"><div class="alliance-col-header pick"><h3>&#9733; Pick List</h3></div><div>${pickHTML}</div></div>
        <div class="alliance-col"><div class="alliance-col-header avoid"><h3>&#9888; Avoid</h3></div><div>${avoidHTML}</div></div>
      </div>
      <div class="alliance-all-title">All Teams</div>
      ${allTeams}
    </div>`;
}

function addToList(list,teamKey){
  if(list==='pick'&&!picklist.includes(teamKey)){picklist.push(teamKey);localStorage.setItem('frc_picklist',JSON.stringify(picklist));}
  if(list==='avoid'&&!avoidlist.includes(teamKey)){avoidlist.push(teamKey);localStorage.setItem('frc_avoidlist',JSON.stringify(avoidlist));}
  renderAlliance();
}
function removeFromList(list,teamKey){
  if(list==='pick'){picklist=picklist.filter(k=>k!==teamKey);localStorage.setItem('frc_picklist',JSON.stringify(picklist));}
  if(list==='avoid'){avoidlist=avoidlist.filter(k=>k!==teamKey);localStorage.setItem('frc_avoidlist',JSON.stringify(avoidlist));}
  renderAlliance();
}

// INIT
renderChecklist('event');
renderChecklist('match');
if(currentEvent){
  document.getElementById('eventCodeInput').value=currentEvent;
  document.getElementById('eventBadgeText').textContent=currentEvent;
  document.getElementById('eventBadge').style.display='flex';
  if(eventTeams.length)renderTeamGrid();
}
</script>
